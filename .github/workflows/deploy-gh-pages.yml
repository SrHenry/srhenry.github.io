name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:static
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TARGET: static
          NEXT_PUBLIC_GITHUB_USERNAME: ${{ vars.NEXT_PUBLIC_GITHUB_USERNAME }}
          NEXT_PUBLIC_GITHUB_API_BASE: ${{ vars.NEXT_PUBLIC_GITHUB_API_BASE }}
          NEXT_PUBLIC_GRAVATAR_EMAIL_HASH: ${{ vars.NEXT_PUBLIC_GRAVATAR_EMAIL_HASH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GITHUB_LINK: ${{ vars.NEXT_PUBLIC_GITHUB_LINK }}
          NEXT_PUBLIC_LINKEDIN_LINK: ${{ vars.NEXT_PUBLIC_LINKEDIN_LINK }}
          NEXT_PUBLIC_GITLAB_LINK: ${{ vars.NEXT_PUBLIC_GITLAB_LINK }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL }}
          NEXT_PUBLIC_CACHE_TTL: ${{ vars.NEXT_PUBLIC_CACHE_TTL }}

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
